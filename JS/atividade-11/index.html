<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Entender valores que podem ser alterados e não podem ser alterados.</h1>
    <label for="nome">Digite seu nome:</label><br>
    <input type="text" name="nome" id="nome"><br>
    <label for="num-1">Digite o primeiro numero:</label><br>
    <input type="number" name="num-1" id="num-1"><br>
    <label for="num-2">Digite o segundo numero:</label><br>
    <input type="number" name="num-2" id="num-2"><br>
    <label for="num-3">Digite o terceiro numero:</label><br>
    <input type="number" name="num-3" id="num-3"><br>
    <button onclick="multiplicar()">Enviar</button>
    <script>
        function multiplicar() {
            const nome = document.getElementById("nome").value;
            const num1 = document.getElementById("num-1").value;
            const num2 = document.getElementById("num-2").value;
            const num3 = document.getElementById("num-3").value;

            let multi = num1 * num2 * num3;

            document.getElementById("saida").innerHTML = "Seu nome é " + nome + "<br>A multiplicação dos numeros é: " + multi

        }
    </script>
</body>

</html>
