<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Soma de dois numeros</h1>
    <p>Digite os números</p>
    <input type="number" name="num1" id="num1" placeholder="Digite o número">
    <input type="number" name="num2" id="num2" placeholder="Digite o número">
    <button onclick="somar()">Somar</button>
    <p id="resultado"></p>
    <script>
        function somar() {
            let num1 = parseFloat(document.getElementById("num1").value)
            let num2 = parseFloat(document.getElementById("num2").value)

            let soma = num1 + num2

            document.getElementById('resultado').textContent = "A soma dos numeros é: " + soma;
        }
    </script>
</body>

</html>
