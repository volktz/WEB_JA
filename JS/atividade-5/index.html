<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div>
        <form action="">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required placeholder="Digite seu nome."><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="Digite seu e-mail."><br><br>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required placeholder="Digite sua senha."><br><br>

            <button type="submit" onclick="enviar()">Enviar</button>
        </form>
    </div>
    <script src="scripts.js"></script>
</body>

</html>
